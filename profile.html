<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藍漢光課程總表 | 真心人設計工作室</title>
    
    <!-- 引入 Google 字體 Noto Sans TC -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 React 與 ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 讓瀏覽器可以編譯 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- 配置 Tailwind 主題與動畫 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pop-in': 'popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                }
            }
        }
    </script>
    <style>
        /* 自訂滾動條，提升細節質感 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 避免圖片載入前破版 */
        .image-placeholder { background-color: #f3f4f6; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-purple-200 selection:text-purple-900">
    <!-- React 掛載點 -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CourseCatalog = () => {
            const [activeCategory, setActiveCategory] = useState('所有課程');
            const [showLecturer, setShowLecturer] = useState(false);
            const [showPayment, setShowPayment] = useState(false);
            const [expandedCourses, setExpandedCourses] = useState({});

            const [isChatOpen, setIsChatOpen] = useState(false);
            const [chatInput, setChatInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [chatHistory, setChatHistory] = useState([
                { role: 'model', text: '你好！我是真心人設計工作室的 AI 課程顧問。想了解哪方面的課程呢？可以告訴我您的需求，例如：「我想找適合高中生，能運用手機產出短影音的課程」。' }
            ]);
            const chatEndRef = useRef(null);

            // 自動捲動到聊天底部
            useEffect(() => {
                if (isChatOpen && chatEndRef.current) {
                    chatEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [chatHistory, isChatOpen, isTyping]);

            const handleSendMessage = async () => {
                if (!chatInput.trim()) return;

                const userMsg = chatInput.trim();
                setChatHistory(prev => [...prev, { role: 'user', text: userMsg }]);
                setChatInput('');
                setIsTyping(true);

                try {
                    const apiKey = ""; // 平台會自動提供 API Key
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    // 構建歷史對話紀錄給 Gemini
                    const formattedHistory = chatHistory.map(msg => ({
                        role: msg.role,
                        parts: [{ text: msg.text }]
                    }));
                    formattedHistory.push({ role: 'user', parts: [{ text: userMsg }] });

                    const systemPrompt = `你現在是「藍漢光」老師的專屬 AI 課程顧問，隸屬於「真心人設計工作室」。
                    你的任務是根據使用者的需求，推薦合適的課程，或是回答關於老師的問題。
                    請用親切、專業、有熱情的台灣繁體中文回覆，語氣要自然。
                    以下是目前提供的課程列表：
                    1. 鏡頭魔法師：手機攝影與活動紀錄 (視覺影像) - 學習手機鏡頭、動態捕捉、活動企劃。
                    2. 動感教室：Canva 短影音製作 (視覺影像) - Canva特效、剪輯、產出社團宣傳片。
                    3. AI 繪圖大冒險：從靈感到具象 (美感設計) - AI提示詞、班級識別生成、情境圖輔助。
                    4. 班級經營美學：Canva x AI 實用文創設計 (美感設計) - 實用文創(祈福卡、海報)、Mockup合成。
                    5. AI 故事屋：Gemini 創意引導與備課 (數位創新) - 生硬知識轉化、跨科備課、閃示卡。
                    6. 校園大偵探：互動式地圖與數位圖鑑 (數位創新) - Google我的地圖、校園GIS。
                    所有課程皆為2小時，講師費2000元/小時(共4000元)，雙北以外交通費另計。
                    聯絡方式：電話 0921-995-886，Line: human0717。
                    回覆請盡量精簡扼要，條理分明。若超出範圍請引導回課程相關討論。`;

                    const payload = {
                        contents: formattedHistory,
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    };

                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();
                    if (data.candidates && data.candidates.length > 0) {
                        const modelText = data.candidates[0].content.parts[0].text;
                        setChatHistory(prev => [...prev, { role: 'model', text: modelText }]);
                    } else {
                        throw new Error("Invalid response");
                    }
                } catch (error) {
                    console.error("AI 顧問連線錯誤:", error);
                    setChatHistory(prev => [...prev, { role: 'model', text: '抱歉，系統目前連線不穩定，請稍後再試。' }]);
                } finally {
                    setIsTyping(false);
                }
            };

            const toggleCourse = (id) => {
                setExpandedCourses(prev => ({
                    ...prev,
                    [id]: !prev[id]
                }));
            };

            const categories = ['所有課程', '視覺影像', '美感設計', '數位創新'];

            const courses = [
                {
                    id: 1,
                    category: "視覺影像",
                    title: "鏡頭魔法師：手機攝影與活動紀錄",
                    duration: "2小時",
                    image: "01.png?w=800&q=80",
                    video: "",
                    content: [
                        "手機鏡頭特性與光線運用 (30min)",
                        "運鏡與動態捕捉技巧：校慶大隊接力、社團表演動態攝影 (30min)",
                        "腳本設計與活動企劃：校慶大隊接力與童軍露營敘事拍攝 (1hr)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、學員需自備手機"
                },
                {
                    id: 2,
                    category: "視覺影像",
                    title: "動感教室：Canva 短影音製作",
                    duration: "2小時",
                    image: "02.png?w=800&q=80",
                    video: "",
                    content: [
                        "Canva 影片轉場特效與無版權背景音樂搭配 (30min)",
                        "影片節奏剪輯與吸睛字卡、標題設計 (30min)",
                        "實戰產出：製作班級運動會進場或社團招生宣傳短片 (1hr)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、需事先註冊 Canva 帳號"
                },
                {
                    id: 3,
                    category: "美感設計",
                    title: "AI 繪圖大冒險：從靈感到具象",
                    duration: "2小時",
                    image: "03.png?w=800&q=80",
                    video: "",
                    content: [
                        "AI 繪圖詠唱心法與結構化提示詞 (40min)",
                        "班級專屬識別：生成班服圖案草圖與班級精神吉祥物 (40min)",
                        "教學情境輔助：生成歷史事件還原圖或文學情境 3D 視覺 (40min)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、穩定網路環境"
                },
                {
                    id: 4,
                    category: "美感設計",
                    title: "班級經營美學：Canva x AI 實用文創設計",
                    duration: "2小時",
                    image: "04.png?w=800&q=80",
                    video: "",
                    content: [
                        "AI 素材整合與 Canva 排版美學 (30min)",
                        "班級實用文創：設計段考祈福小卡、班級公約海報與幹部名牌 (30min)",
                        "實境合成 (Mockup)：將設計合成至展板、文具或衣服等實體周邊 (1hr)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、需具備 Canva 基礎操作能力"
                },
                {
                    id: 5,
                    category: "數位創新",
                    title: "AI 故事屋：Gemini 創意引導與備課",
                    duration: "2小時",
                    image: "05.png?w=800&q=80",
                    video: "",
                    content: [
                        "運用 Gemini 將生硬知識轉化為趣味情境腳本 (30min)",
                        "跨科備課實戰：如生成「歷史大航海時代對話」或「生物細胞分裂解說」 (30min)",
                        "圖文整合：結合 Canva 批量產出會考複習閃示卡 (1hr)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、Google 帳號"
                },
                {
                    id: 6,
                    category: "數位創新",
                    title: "校園大偵探：互動式地圖與數位圖鑑",
                    duration: "2小時",
                    image: "06.png?w=800&q=80",
                    video: "",
                    content: [
                        "Google 我的地圖基礎與座標批次匯入 (40min)",
                        "跨域專題應用：結合校史回顧、學區周邊美食或交通安全危險熱點 (40min)",
                        "產出可互動的校園地理資訊 (GIS) 或社區數位走讀地圖 (40min)"
                    ],
                    fee: "講師費 2000元/小時 (共4000元)",
                    remarks: "單槍投影機、電腦、Google 帳號"
                }
            ];

            const filteredCourses = activeCategory === '所有課程' 
                ? courses 
                : courses.filter(course => course.category === activeCategory);

            return (
                <div className="min-h-screen pb-16 flex flex-col relative overflow-hidden">
                    
                    {/* 網頁背景裝飾點綴 (只在最外層，不影響內容) */}
                    <div className="fixed top-[-10%] left-[-10%] w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-[100px] opacity-30 -z-10 animate-pulse"></div>
                    <div className="fixed bottom-[-10%] right-[-5%] w-[30rem] h-[30rem] bg-blue-300 rounded-full mix-blend-multiply filter blur-[120px] opacity-30 -z-10 animate-pulse" style={{ animationDelay: '2s' }}></div>

                    <div className="flex-grow">
                        {/* Header Banner - 優化為立體光影與毛玻璃效果 */}
                        <div className="relative bg-slate-900 text-white py-20 px-4 mb-12 text-center overflow-hidden shadow-2xl animate-fade-in-up" style={{ animationDuration: '0.8s' }}>
                            {/* Banner 內部漸層與光暈裝飾 */}
                            <div className="absolute inset-0 bg-gradient-to-br from-blue-700/80 via-purple-800/80 to-slate-900 z-0"></div>
                            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-3xl h-full opacity-40 blur-[80px] z-0">
                                <div className="absolute inset-0 bg-gradient-to-r from-cyan-400 to-purple-500 rounded-full"></div>
                            </div>

                            <div className="relative z-10">
                                <h1 className="text-4xl md:text-5xl font-black mb-4 tracking-widest drop-shadow-lg">藍漢光</h1>
                                <p className="text-blue-200 max-w-2xl mx-auto text-lg md:text-xl font-medium tracking-wide mb-10 drop-shadow-md">真心人設計工作室</p>
                                
                                <div className="flex justify-center gap-4 sm:gap-6">
                                    <button 
                                        onClick={() => setShowLecturer(true)}
                                        className="group px-6 py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full text-white font-medium transition-all duration-300 flex items-center backdrop-blur-md shadow-lg hover:shadow-white/20 hover:-translate-y-1"
                                    >
                                        <svg className="w-5 h-5 mr-2 text-blue-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                                        講師資訊
                                    </button>
                                    <button 
                                        onClick={() => setShowPayment(true)}
                                        className="group px-6 py-3 bg-white/10 hover:bg-white/20 border border-white/20 rounded-full text-white font-medium transition-all duration-300 flex items-center backdrop-blur-md shadow-lg hover:shadow-white/20 hover:-translate-y-1"
                                    >
                                        <svg className="w-5 h-5 mr-2 text-purple-300 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                                        匯款資訊
                                    </button>
                                </div>
                            </div>
                        </div>

                        {}
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            
                            {/* Filter Tabs - 優化陰影與點擊回饋 */}
                            <div className="flex flex-wrap justify-center gap-3 mb-12 animate-fade-in-up" style={{ animationDelay: '0.1s' }}>
                                {categories.map((cat) => (
                                    <button
                                        key={cat}
                                        onClick={() => setActiveCategory(cat)}
                                        className={`px-6 py-2.5 rounded-full text-sm font-bold tracking-wide transition-all duration-300 ease-out border ${
                                            activeCategory === cat
                                                ? 'bg-slate-800 text-white border-slate-800 shadow-xl shadow-slate-300 scale-105'
                                                : 'bg-white text-slate-500 border-slate-200 hover:border-purple-300 hover:text-purple-600 hover:bg-purple-50 hover:shadow-md'
                                        }`}
                                    >
                                        {cat}
                                    </button>
                                ))}
                            </div>

                            {/* Course Grid */}
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 xl:gap-10">
                                {filteredCourses.map((course, index) => (
                                    // 加入 key 綁定 activeCategory 達成切換標籤時重置進場動畫的效果
                                    <div 
                                        key={`${activeCategory}-${course.id}`} 
                                        className="bg-white rounded-3xl border border-slate-100 overflow-hidden shadow-sm hover:shadow-2xl transition-shadow duration-500 flex flex-col group opacity-0 animate-fade-in-up"
                                        style={{ animationDelay: `${index * 120 + 200}ms` }}
                                    >
                                        
                                        {/* 圖片區塊 - 增加高度、加入微縮放與遮罩漸層 */}
                                        <div className="h-60 w-full relative overflow-hidden bg-slate-100 image-placeholder">
                                            {course.video ? (
                                                <video 
                                                    autoPlay loop muted playsInline poster={course.image}
                                                    className="w-full h-full object-cover transform group-hover:scale-105 transition-transform duration-700 ease-out"
                                                    onCanPlay={(e) => e.target.play().catch(() => {})}
                                                >
                                                    <source src={course.video} type="video/mp4" />
                                                </video>
                                            ) : (
                                                <img 
                                                    src={course.image} 
                                                    alt={course.title} 
                                                    referrerPolicy="no-referrer"
                                                    // 當原圖片連結失效時的備用圖
                                                    onError={(e) => { e.target.src = 'https://placehold.co/800x600/f8fafc/94a3b8?text=Image+Not+Found' }}
                                                    className="w-full h-full object-cover transform group-hover:scale-110 transition-transform duration-700 ease-out"
                                                />
                                            )}
                                            
                                            {/* 照片底部漸層，讓標籤更清晰 */}
                                            <div className="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-black/10 z-10 pointer-events-none"></div>
                                            
                                            <span className="absolute top-4 left-4 bg-white/95 backdrop-blur-md px-3 py-1.5 text-xs font-bold text-slate-800 rounded-lg shadow-md z-20 border border-white/50">
                                                {course.category}
                                            </span>
                                        </div>

                                        {}
                                        <div className="p-7 flex-grow flex flex-col bg-white z-20 relative">
                                            
                                            {/* 時數標籤 - 移到標題上方，看起來更精緻 */}
                                            <div className="flex items-center text-xs font-bold text-indigo-600 bg-indigo-50 w-fit px-3 py-1.5 rounded-md mb-4">
                                                <svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                                時數 {course.duration}
                                            </div>

                                            <h3 className="text-xl font-bold text-slate-900 mb-6 leading-snug group-hover:text-indigo-700 transition-colors">{course.title}</h3>

                                            {/* 展開摺疊區塊 - 改善動畫過渡 */}
                                            <div className={`overflow-hidden transition-all duration-500 ease-in-out ${expandedCourses[course.id] ? 'max-h-[800px] opacity-100 mb-6' : 'max-h-0 opacity-0 mb-0'}`}>
                                                
                                                {/* 大綱框框 - 改變底色，增加區塊層次 */}
                                                <div className="bg-slate-50/80 rounded-2xl p-5 mb-5 border border-slate-100">
                                                    <h4 className="text-sm font-bold text-slate-800 mb-3 flex items-center">
                                                        <svg className="w-4 h-4 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                                                        課程內容大綱
                                                    </h4>
                                                    <ul className="space-y-3">
                                                        {course.content.map((item, index) => (
                                                            <li key={index} className="text-sm text-slate-600 flex items-start leading-relaxed">
                                                                <div className="w-1.5 h-1.5 rounded-full bg-indigo-400 mr-2.5 mt-1.5 shrink-0"></div>
                                                                <span>{item}</span>
                                                            </li>
                                                        ))}
                                                    </ul>
                                                </div>

                                                {/* 備註與費用資訊 */}
                                                <div className="space-y-3 text-sm pt-2">
                                                    <div className="flex items-start">
                                                        <span className="font-bold text-indigo-800 shrink-0 bg-indigo-100 px-2 py-1 rounded text-xs mr-3">費用</span>
                                                        <span className="text-slate-600 pt-0.5 leading-tight">
                                                            {course.fee}
                                                            <span className="block text-xs text-rose-500 mt-1 font-medium">※ 雙北以外交通費另計</span>
                                                        </span>
                                                    </div>
                                                    <div className="flex items-start">
                                                        <span className="font-bold text-purple-800 shrink-0 bg-purple-100 px-2 py-1 rounded text-xs mr-3">需求</span>
                                                        <span className="text-slate-600 pt-0.5 leading-tight">{course.remarks}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            {/* 操作按鈕 - 移到最底端並自動推齊 */}
                                            <button 
                                                onClick={() => toggleCourse(course.id)}
                                                className={`mt-auto w-full py-3 font-bold rounded-xl transition-all duration-300 flex justify-center items-center ${
                                                    expandedCourses[course.id]
                                                    ? 'bg-slate-100 text-slate-600 hover:bg-slate-200' 
                                                    : 'bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white hover:shadow-lg hover:shadow-indigo-200'
                                                }`}
                                            >
                                                {expandedCourses[course.id] ? '收起詳細資訊' : '查看完整大綱'}
                                                <svg className={`w-4 h-4 ml-1.5 transform transition-transform duration-300 ${expandedCourses[course.id] ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path></svg>
                                            </button>
                                        </div>
                                    </div>

                                        onClick={handleSendMessage}

                            )}

                </div>
            );

        root.render(<CourseCatalog />);
